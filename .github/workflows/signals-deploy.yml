name: Signals Worker Deploy

# Deploys the standalone signals-worker Cloudflare Worker (the confluence
# engine's dashboard + API routes, bound at frontiercapitalsignals.com/signals*
# — distinct from the main Next.js site's own deploy.yml, and from
# signals-refresh.yml/signals-daily.yml, which only ever write DATA into
# KV/D1 via plain Node and never touch the Worker's own deployed code).
# Until this workflow existed, every worker.js change needed a manual
# `wrangler deploy` (per this repo's own long-standing header comment) —
# this closes that gap using the same CLOUDFLARE_API_TOKEN/
# CLOUDFLARE_ACCOUNT_ID secrets already relied on by the workflows above.
on:
  push:
    branches: [main]
    paths:
      - "signals-worker/**"
      - ".github/workflows/signals-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Static, credential-free check that every workflow is wired to the
      # configuration it actually reads. Runs FIRST and on its own, because the
      # bug it exists for (signals-replay.yml reading the D1 id from the wrong
      # context for its entire life) is invisible to every other test here:
      # those import the Worker, while this one reads the YAML.
      - name: Check workflow wiring
        working-directory: signals-worker
        run: node test-workflows.mjs

      # Fail before touching remote schema or code if the public Worker, the
      # private journal route, or the lagged retrospective statistics regress.
      - name: Test Worker and analytical additions
        working-directory: signals-worker
        run: |
          node test-worker.mjs
          node test-trade-journal.mjs
          node test-crash-recovery-research.mjs
          node test-retrospective.mjs
          node test-session-freeze.mjs
          node --test test-adaptive-model.mjs
          node --test test-data-quality.mjs
          node --test test-session-data.mjs
          node --test test-market-insights.mjs
          node --test test-oi-watchlist.mjs
          node --test test-tracked-assets.mjs
          node --test test-archive-sources.mjs
          node --test ../account-journal/test/*.test.mjs

      # The dashboard is RENDERED and interrogated, not string-matched. This is
      # the layer that catches a page which parses but does not work: a
      # renderer that throws on a real payload, a filter that hides the wrong
      # rows, or the withholding gate failing to be reached at runtime. It
      # needs a DOM, so it installs jsdom rather than carrying it in the site's
      # own dependency tree.
      # `npm ci` and a committed lockfile, NOT `npm install`. On 2026-09-22 this
      # step resolved undici fresh, picked up 8.11.0 published 23 minutes
      # earlier as a transitive dependency of jsdom, and the probe started
      # reporting six false failures with no commit behind them. The code is
      # immune to that particular hijack now; this is what makes any future
      # dependency change a reviewable commit instead of a surprise at 07:20.
      - name: Install dashboard test dependencies
        working-directory: signals-worker
        run: npm ci --no-audit --no-fund

      - name: Test the rendered dashboard and the health checker
        working-directory: signals-worker
        run: |
          node test-dashboard.mjs
          node test-health-check.mjs

      # Schema migrations are applied before code that reads the new table is
      # deployed. Re-running is safe: Wrangler records applied migrations.
      - name: Apply D1 migrations
        working-directory: signals-worker
        run: npx --yes wrangler@4 d1 migrations apply frontier-capital-signals-reliability --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Optional reliable-refresh bridge. Keeping this as a Worker secret
      # avoids exposing the GitHub Actions token to browser code or KV data.
      - name: Sync stale-cache dispatch token
        working-directory: signals-worker
        run: |
          if [ -z "$HUB_ACTIONS_TOKEN" ]; then
            echo "HUB_ACTIONS_TOKEN is not configured; stale-cache dispatch remains disabled"
            exit 0
          fi
          printf '%s' "$HUB_ACTIONS_TOKEN" | npx --yes wrangler@4 secret put GITHUB_ACTIONS_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HUB_ACTIONS_TOKEN: ${{ secrets.HUB_ACTIONS_TOKEN }}

      # The Worker cron sends a compact summary when the read-only account
      # journal imports a non-bot/unknown fill. The same private topic is
      # already used by the analytical workflows; syncing it as a Worker
      # secret keeps it out of source, KV, and browser responses.
      - name: Sync private notification topic
        working-directory: signals-worker
        run: |
          if [ -z "$PRIVATE_NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC is not configured; account-journal pushes remain disabled"
            exit 0
          fi
          printf '%s' "$PRIVATE_NTFY_TOPIC" | npx --yes wrangler@4 secret put NTFY_TOPIC
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRIVATE_NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      # Exercise the exact GitHub API call used by the Worker. This makes a
      # bad/revoked token visible in this deployment's log instead of leaving
      # a stale cache silently waiting for the next Cloudflare cron. force=false
      # preserves build-signals.mjs's normal freshness gate.
      - name: Verify and prime stale-cache refresh dispatch
        run: |
          if [ -z "$HUB_ACTIONS_TOKEN" ]; then
            echo "HUB_ACTIONS_TOKEN is not configured; skipping refresh dispatch verification"
            exit 0
          fi
          curl --fail --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/chiduwa/frontiercapitalsignals/actions/workflows/signals-refresh.yml/dispatches" \
            --header "Authorization: Bearer $HUB_ACTIONS_TOKEN" \
            --header "User-Agent: frontier-capital-signals" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data '{"ref":"main","inputs":{"force":"false"}}'
          echo "Signals Refresh dispatch accepted"
        env:
          HUB_ACTIONS_TOKEN: ${{ secrets.HUB_ACTIONS_TOKEN }}

      # Enforced, not auto-fixed: wrangler deploys src/worker.js, but the
      # actual source of truth is worker.js at the signals-worker root (no
      # build step wires them together). A silent auto-copy here could
      # paper over someone having edited the wrong copy; failing loudly
      # is safer for a file this important.
      - name: Verify src/worker.js is byte-identical to worker.js
        working-directory: signals-worker
        run: diff worker.js src/worker.js

      - name: Deploy to Cloudflare Workers
        working-directory: signals-worker
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Post-deploy smoke test against what was just published. Scoped to
      # `page` deliberately: a deploy can break the render, the page contract
      # or the site's routes, and it can do nothing about a stale upstream — so
      # failing this step on data age would blame the deploy for someone else's
      # outage and train everyone to ignore it.
      - name: Smoke-test the deployed page
        working-directory: signals-worker
        run: node scripts/health-check.mjs --scope=page
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
