name: Signals Live Scan

# The forward-looking half of the 2026-09-01 request: warn BEFORE the move
# rather than explain it after. Hourly, because every configuration is
# defined on hourly bars against a 48-hour trailing median — scanning more
# often would re-evaluate the same closed bar and cast duplicates (the
# UNIQUE (config_id, symbol, cast_at) constraint would reject them, but
# spending the fetches to be rejected is pointless).
#
# PRIMARY TRIGGER IS THE CLOUDFLARE WORKER CRON (see CADENCE_DISPATCHES in
# signals-worker/worker.js), which asks for this workflow once an hour.
# Measured 2026-09-15 over the trailing run history, this workflow's own hourly
# GitHub schedule delivered 86 of ~331 requested firings -- 26%, median gap 247
# minutes against an intended 60, worst 467. A scanner whose entire purpose is
# to warn BEFORE the move cannot do that while missing three hourly bars in
# four, so the reliable trigger matters more here than almost anywhere else.
#
# The GitHub schedule stays as fallback coverage at :25, clear of
# signals-refresh (:13) and the round-hour boundary, per this repo's existing
# note on scheduling contention. An occasional double-firing costs a repeat
# scan of one closed bar whose casts the UNIQUE (config_id, symbol, cast_at)
# constraint then rejects -- wasteful, bounded, and never double-counted.
on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:
    inputs:
      symbols:
        description: "How many Binance-global symbols to scan"
        required: false
        default: "250"

concurrency:
  group: signals-live-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # ~250 klines calls at 120ms pacing is ~1 minute of fetch time, plus
    # scoring and D1 writes. Every outbound call is individually bounded by
    # fetchWithTimeout, so this ceiling is about total time, not hangs.
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Same convention as every other workflow here: migrations before the
      # code that reads the new tables. Re-running is safe.
      - name: Apply D1 migrations
        working-directory: signals-worker
        run: npx --yes wrangler@4 d1 migrations apply frontier-capital-signals-reliability --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Scan for surge signals, score matured casts, notify
        working-directory: signals-worker
        run: node scripts/live-scan.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FCS_D1_DATABASE_ID: ${{ vars.FCS_D1_DATABASE_ID }}
          LIVE_SCAN_SYMBOLS: ${{ inputs.symbols || '250' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
