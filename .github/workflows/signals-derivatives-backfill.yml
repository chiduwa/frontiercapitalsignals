name: Signals Derivatives Backfill

# On-demand accelerator for the deep derivatives history backfill
# (derivatives_daily, migration 0033). signals-daily.yml runs the same script
# once a day with a small budget to keep the archive current; this is how you
# catch it up fast in the first place, or re-deepen it after widening
# DERIV_START_DATE.
#
# Why it needs its own workflow rather than a bigger daily budget: Binance's
# public data portal serves ONE FILE PER SYMBOL PER DAY and publishes no
# monthly metrics roll-up, so a first full-depth pass across the tracked perp
# universe is on the order of 141k requests. That belongs in a job you
# deliberately start, not in the daily critical path.
#
# Idempotent and resumable — every run reads what is already stored and
# fetches only what is missing — so re-running a caught-up archive is a fast
# no-op, and an interrupted run loses nothing.
#
# Run several in a row (or several at once with disjoint `symbols` lists) to
# parallelise: workers scoped to different symbols never contend, because the
# script partitions all of its reads and writes by symbol.
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Oldest date to reach for (YYYY-MM-DD). Binance metrics begin 2020-09-01 for BTC; most majors 2022."
        required: false
        default: "2023-01-01"
      row_budget:
        description: "Max derivative rows to write this run"
        required: false
        default: "400000"
      time_budget_min:
        description: "Stop cleanly after this many minutes"
        required: false
        default: "300"
      concurrency:
        description: "Parallel portal requests"
        required: false
        default: "48"
      symbols:
        description: "Optional comma-separated symbol list, to split work across simultaneous runs. Blank = whole universe."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    # Public repo, so Actions minutes are free and this can be generous. The
    # script enforces its own time budget below this, so the job timeout is a
    # backstop against a hang, not the thing that governs the run.
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Backfill derivatives archive
        working-directory: signals-worker
        run: node scripts/backfill-derivatives.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FCS_D1_DATABASE_ID: ${{ vars.FCS_D1_DATABASE_ID }}
          DERIV_START_DATE: ${{ inputs.start_date }}
          DERIV_ROW_BUDGET: ${{ inputs.row_budget }}
          DERIV_TIME_BUDGET_MIN: ${{ inputs.time_budget_min }}
          DERIV_FETCH_CONCURRENCY: ${{ inputs.concurrency }}
          DERIV_SYMBOLS: ${{ inputs.symbols }}

      # Read-only evidence report over whatever depth now exists. Printed to
      # the job log rather than written anywhere: promotion of any feature
      # found here still goes through the cross-sectional lane's own gate.
      - name: Evidence report
        working-directory: signals-worker
        continue-on-error: true
        run: node scripts/derivatives-research.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FCS_D1_DATABASE_ID: ${{ vars.FCS_D1_DATABASE_ID }}
