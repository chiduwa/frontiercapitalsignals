name: Daily Intelligence Generation

on:
  schedule:
    - cron: "0 7 * * *"   # 7:00 AM UTC daily
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # Required by "Trigger deploy" below to POST .../dispatches.
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate daily intelligence
        # A quota/RSS hiccup here should never block deploys of unrelated code
        # changes — deploy lives in its own workflow (deploy.yml) that doesn't
        # depend on this step succeeding. Note that deploy.yml's `on: push`
        # trigger does NOT cover this job's own commits; see "Trigger deploy".
        continue-on-error: true
        env:
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: node scripts/generate-intelligence.mjs

      - name: Commit new posts
        id: commit
        run: |
          git config --global user.name "FCS Intelligence Bot"
          git config --global user.email "bot@frontiercapitalsignals.com"
          git add content/intelligence/
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new intelligence to commit."
          else
            git commit -m "chore: daily intelligence update $(date +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # GitHub will not start a workflow run from a push that was authenticated
      # with GITHUB_TOKEN. That is its recursion guard, it is not configurable,
      # and it means deploy.yml's `on: push` never fires for the bot commit
      # above: the articles land on main and stop there while every workflow in
      # this repo still reports green. A workflow_dispatch raised through the
      # API with that same GITHUB_TOKEN *does* run — that asymmetry is the
      # entire reason this step exists. Diagnosed 2026-09-18, after 09-17 and
      # 09-18 each reached main and neither reached production.
      #
      # Deliberately not `always()`: if the push above failed, main does not
      # have the content, and deploying would republish the previous state
      # while reporting success.
      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        run: |
          status=$(curl -s -o /tmp/dispatch.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}')
          cat /tmp/dispatch.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::deploy.yml dispatch rejected (HTTP $status) - today's intelligence is on main but will not reach production"
            exit 1
          fi
          echo "deploy.yml dispatched."
