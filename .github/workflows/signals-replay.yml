name: Signals Replay

# Walk-forward replay of the confluence model over asset_daily_bars, writing
# matured, no-look-ahead outcomes into forecast_outcomes with provenance='replay'.
#
# WHY IT IS A WORKFLOW AND NOT A ONE-OFF: the model version is part of the
# checkpoint key, so a future change to the weighting (the thing that makes
# composite outcomes mean something different) starts a fresh replay rather than
# blending two models' evidence. Keeping the runner wired up means re-answering
# "does this model have skill" is a dispatch, not an afternoon.
#
# That checkpoint-key property is exactly what makes this job urgent right now
# rather than occasional: the v8 -> v9 move on September 20 started a fresh
# replay AND invalidated every outcome the engine had accumulated, so this is
# currently the only thing that can restore a published direction this side of
# February. The schedule note below has the numbers.
on:
  schedule:
    # 04:11 UTC DAILY, not weekly. Off signals-daily's 02:37 and the hourly :13
    # mark, and after D1's 00:00 write-quota reset so a long run starts with a
    # full budget.
    #
    # The weekly cadence above was right for a BUILT ledger and wrong for an
    # empty one, and the ledger is empty: the September 20 release moved
    # OUTCOME_MODEL_VERSION to confluence-v9 and narrowed
    # WEIGHT_INDEPENDENT_MODEL_VERSIONS to ['confluence-v9'], so every
    # accumulated v7/v8 outcome stopped counting at once. That is the correct
    # call scientifically — v9 is a different model and blending their outcomes
    # would be worse — but it means assetClassSkill is back to needing
    # CLASS_SKILL_MIN_SAMPLES (150) DISTINCT run_at days of matured composite
    # outcomes, and live accrual adds one day per day. That is five months of
    # every direction withheld and the trading bot able to open nothing.
    #
    # This job is the designed way out (see commit 742421f, "break the
    # reliability deadlock and replay history instead of waiting for it"): it
    # writes composite outcomes with HISTORICAL run_at dates, so one run can
    # supply hundreds of distinct days. It is checkpointed per
    # (asset_class, horizon, model_version) and budgeted, so a daily run
    # resumes the backfill instead of re-walking it, and a run that hits its
    # budget or the 120-minute cap costs a day rather than a week.
    #
    # Once classSkill publishes again, daily is cheap rather than useful — the
    # archive grows by one bar a day — so this may go back to "11 4 * * 0"
    # then. It is not a threshold change either way: nothing here lowers a
    # publication gate, it only stops the engine waiting on evidence it could
    # have computed.
    - cron: "11 4 * * *"
  workflow_dispatch:
    inputs:
      asset_class:
        description: "crypto, stock, or blank for both"
        required: false
        default: ""
      budget:
        description: "Max outcome rows to write this run"
        required: false
        default: "400000"
      reset:
        description: "Clear checkpoints and replay from the beginning"
        type: boolean
        required: false
        default: false

concurrency:
  group: signals-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    # The replay is resumable and budgeted, so a cancellation costs only the
    # anchors since the last checkpoint rather than the whole run. 120 matches
    # the ceiling signals-daily.yml settled on; this repo is public so Actions
    # minutes are free.
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Idempotent, same pattern as the other signals workflows: the replay
      # needs migration 0038's provenance column and replay_checkpoints table.
      - name: Apply pending D1 migrations
        working-directory: signals-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest d1 migrations apply frontier-capital-signals-reliability --remote

      - name: Guardrail tests
        working-directory: signals-worker
        # A replay that has drifted from the live model, or that has acquired a
        # look-ahead, produces BETTER numbers and no error. These run first for
        # that reason — there is no downstream check that would catch it.
        run: node --test test-replay.mjs test-cross-sectional.mjs

      - name: Clear checkpoints
        if: ${{ inputs.reset }}
        working-directory: signals-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FCS_D1_DATABASE_ID: ${{ vars.FCS_D1_DATABASE_ID }}
        run: node scripts/replay-history.mjs --reset

      - name: Replay
        working-directory: signals-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FCS_D1_DATABASE_ID: ${{ vars.FCS_D1_DATABASE_ID }}
        run: |
          ARGS="--budget ${{ inputs.budget || '400000' }}"
          if [ -n "${{ inputs.asset_class }}" ]; then ARGS="$ARGS --asset-class ${{ inputs.asset_class }}"; fi
          node scripts/replay-history.mjs $ARGS

      # The point of the whole exercise. Prints per-period edge over the model's
      # own no-skill baseline with Newey-West standard errors — never a pooled
      # per-cast figure, which reads ~8x larger and means nothing. Runs even if
      # the replay above hit its budget, since a partial ledger is still
      # testable and the answer usually does not move much after a few hundred
      # periods.
      - name: Does the model beat its own baseline?
        if: always()
        working-directory: signals-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FCS_D1_DATABASE_ID: ${{ vars.FCS_D1_DATABASE_ID }}
        run: node scripts/replay-report.mjs
