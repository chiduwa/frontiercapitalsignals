name: Weekly SEO Maintenance

on:
  schedule:
    - cron: "0 8 * * 1"   # Every Monday 8:00 AM UTC
  workflow_dispatch:

jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # Required by "Trigger deploy" below to POST .../dispatches.
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Regenerate llms.txt
        run: node scripts/generate-llms-txt.mjs

      - name: Commit llms.txt if changed
        id: commit
        run: |
          git config --global user.name "FCS Intelligence Bot"
          git config --global user.email "bot@frontiercapitalsignals.com"
          git add public/llms.txt
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: refresh llms.txt $(date +%Y-%m-%d)"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with GITHUB_TOKEN never starts deploy.yml, so the refreshed
      # llms.txt sat on main until an unrelated human push carried it. Same fix
      # as daily-intelligence.yml: dispatch the deploy explicitly.
      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        run: |
          status=$(curl -s -o /tmp/dispatch.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}')
          cat /tmp/dispatch.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::deploy.yml dispatch rejected (HTTP $status) - the refreshed llms.txt will not reach production"
            exit 1
          fi

      - name: Check Core Web Vitals via PageSpeed API
        run: |
          if [ -n "${{ secrets.PAGESPEED_API_KEY }}" ]; then
            curl -s "https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=https%3A%2F%2Ffrontiercapitalsignals.com&strategy=mobile&key=${{ secrets.PAGESPEED_API_KEY }}" \
              | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          cats = d.get('lighthouseResult', {}).get('categories', {})
          for k, v in cats.items():
              print(f\"  {k}: {round(v['score']*100)}\")
          "
          else
            echo "PAGESPEED_API_KEY not set — skipping Core Web Vitals check"
          fi
