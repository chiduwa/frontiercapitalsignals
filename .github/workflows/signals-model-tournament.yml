name: Signals Model Tournament

# The per-asset model tournament (signals-worker/scripts/model-tournament.py).
# Daily, after the archive is current: score yesterday's matured forecasts,
# promote or demote on forward evidence only, issue today's forecasts for every
# model in play. Sundays (or on demand) it also proposes new challengers.
# Writes model_forecasts / model_registry / model_tournament_runs; places
# nothing. See signals-worker/docs/MODEL_TOURNAMENT.md.
on:
  workflow_run:
    workflows: [Signals Daily]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '27 17 * * *'
  workflow_dispatch:
    inputs:
      generate:
        description: "Propose new challengers this run (otherwise Sundays only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: signals-model-tournament
  cancel-in-progress: false

jobs:
  tournament:
    runs-on: ubuntu-latest
    # The first run after the universe widened seeds ~70 assets' challengers.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned model libraries
        run: python -m pip install -r signals-worker/scripts/sequence-research-requirements.txt
      - name: Test the promotion rule and the ledger before either touches D1
        working-directory: signals-worker
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python test-model-tournament.py
          node --test test-model-tournament-io.mjs
      - name: Read the tracked panel, 4-hour opens and the tournament state
        working-directory: signals-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FCS_D1_DATABASE_ID: ${{ vars.FCS_D1_DATABASE_ID }}
        run: |
          mkdir -p reports/tournament
          # The universe is a reviewed, fixed list (scripts/tournament-universe.json).
          symbols=$(node -e "const u=require('./scripts/tournament-universe.json');console.log([...u.crypto,...u.stock].join(','))")
          node scripts/hierarchical-research.mjs --dry-run --symbols "$symbols" --save-input reports/tournament/panel.json --load-only
          node scripts/model-tournament-io.mjs data reports/tournament/panel.json reports/tournament/input.json
          node scripts/model-tournament-io.mjs export reports/tournament/state.json
      - name: Score, promote or demote, and issue today's forecasts
        working-directory: signals-worker
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          GENERATE: ${{ inputs.generate && '1' || '' }}
        run: |
          flag=""
          if [ "$(date -u +%u)" = "7" ] || [ -n "$GENERATE" ]; then flag="--generate"; fi
          python scripts/model-tournament.py --input reports/tournament/input.json --state reports/tournament/state.json --output reports/tournament/results.json $flag
      - name: Write forecasts, scores and decisions to D1
        working-directory: signals-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FCS_D1_DATABASE_ID: ${{ vars.FCS_D1_DATABASE_ID }}
        run: node scripts/model-tournament-io.mjs import reports/tournament/results.json
      - name: Preserve state and results, including failed runs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: model-tournament-${{ github.run_id }}
          path: |
            signals-worker/reports/tournament/state.json
            signals-worker/reports/tournament/results.json
            signals-worker/reports/tournament/panel.json
          retention-days: 90
          if-no-files-found: warn
