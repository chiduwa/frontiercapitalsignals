name: Signals Refresh

# Runs the Frontier Capital Signals engine (signals-worker/) hourly and
# writes the result into the signals-worker Cloudflare Worker's KV cache.
# Kept separate from deploy.yml (which ships the Next.js app) since this
# job runs on every hour regardless of whether any code changed.
on:
  # GitHub's `schedule` trigger is a request, not a guarantee. Offsetting off
  # the top of the hour wasn't enough (confirmed live over 97 firings:
  # avg gap 142min vs the intended 60min, worst 281min, never once early),
  # and neither was firing 4x/hour instead of 1x: confirmed over the
  # following 5 days (86 firings, 2026-08-04 to 2026-08-09) that cut the
  # average to 81min, but the worst case was still 349min — GitHub's
  # scheduler doesn't just delay individual slots, it drops whole clusters
  # of them during sustained high-load windows (consistently ~00:00-15:00
  # UTC, peak US GitHub usage), so more slots per hour has diminishing
  # returns against a multi-hour outage rather than a single missed pick.
  #
  # 2026-08-29: measured again, and asking for MORE is actively counter-
  # productive. Over the trailing ~100 scheduled firings at */5 (288 requested
  # per day) GitHub delivered an average gap of 70 minutes, a median of 36, and
  # a worst case of 686 minutes — while this same repo's once-daily crons
  # (daily-intelligence.yml, signals-daily.yml) landed every single day without
  # a miss. The companion signals-intraday.yml, also at 5 minutes, delivered
  # 2 of its 288 requested firings on 2026-08-28. GitHub is dropping the
  # high-frequency crons in this repo, so the */5 experiment did not just fail
  # to help, it added scheduler pressure for nothing.
  #
  # So: back to one modest hourly request (matching CACHE_SECONDS), offset off
  # the top of the hour. GitHub's cron is now FALLBACK coverage only. The
  # freshness users actually see comes from the Worker's own Cloudflare cron,
  # which refreshes the live price layer directly (see refreshLivePriceLayer in
  # worker.js) and dispatches this workflow when the built payload goes stale.
  # That dispatcher sends force=false, so this workflow preserves the same
  # freshness gate and never turns repeated recovery attempts into repeated
  # full rebuilds.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run a full rebuild even when the cached payload is still fresh"
        required: false
        default: true
        type: boolean

concurrency:
  # This run touches shared state (D1, KV) and now takes ~10-11 minutes;
  # if a delayed firing ever overlaps the next hour's, queue rather than
  # run both at once against the same tables/cache.
  group: signals-refresh
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Bumped from 20: the crypto history fetch now pulls up to ~2000 daily
    # bars per coin (was ~210) and stocks fetch 10y (was 1y) for the new
    # dwell/seasonal techniques, so each of the ~160 sequential/pooled
    # requests carries a bigger response — expect build time to grow
    # somewhat from the ~10-11 min baseline. Still well under the hourly
    # cadence either way.
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # A manually dispatched refresh must be able to initialize the newest
      # additive D1 tables too, not depend on a preceding Worker deployment.
      - name: Apply D1 migrations
        working-directory: signals-worker
        run: npx --yes wrangler@4 d1 migrations apply frontier-capital-signals-reliability --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build signals payload and push to KV
        working-directory: signals-worker
        run: node scripts/build-signals.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FCS_KV_NAMESPACE_ID: ${{ vars.FCS_KV_NAMESPACE_ID }}
          FCS_D1_DATABASE_ID: ${{ vars.FCS_D1_DATABASE_ID }}
          TREFIS_OVERRIDES: ${{ vars.TREFIS_OVERRIDES }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Lets build-signals.mjs's freshness pre-check apply only to
          # scheduled firings and Cloudflare's force=false recovery dispatch.
          # A manual workflow dispatch defaults to true and still means
          # "I want a real rebuild right now."
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          FORCE_REFRESH: ${{ inputs.force || 'false' }}
