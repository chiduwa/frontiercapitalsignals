name: Signals Refresh

# Runs the Frontier Capital Signals engine (signals-worker/) hourly and
# writes the result into the signals-worker Cloudflare Worker's KV cache.
# Kept separate from deploy.yml (which ships the Next.js app) since this
# job runs on every hour regardless of whether any code changed.
on:
  # GitHub's `schedule` trigger is a request, not a guarantee, and offsetting
  # off the top of the hour (the original fix here) was NOT enough on its
  # own: confirmed live over 97 scheduled firings (2026-08-01 to 2026-08-03),
  # the average gap was 142min against the intended 60min cadence, the worst
  # was 281min, and it was NEVER once early — this is chronic under this
  # account's load, not a one-off. GitHub's own docs confirm scheduled runs
  # can be delayed or dropped entirely under load, with no guaranteed retry.
  #
  # Fix: fire 4x/hour instead of 1x (still offset from the round :00/:15/:30/
  # :45 marks other repos commonly use) so a delayed or dropped slot has
  # three more chances that same hour to land promptly. This does NOT
  # quadruple real build cost — build-signals.mjs's own freshness pre-check
  # (gated to `schedule` events only) skips the ~130-fetch rebuild whenever
  # the last KV write is under ~50min old, so the actual expensive build
  # still only runs roughly once an hour; the extra scheduled slots are
  # cheap insurance, not extra work. This repo is public, so Actions minutes
  # are free/unlimited regardless.
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  # This run touches shared state (D1, KV) and now takes ~10-11 minutes;
  # if a delayed firing ever overlaps the next hour's, queue rather than
  # run both at once against the same tables/cache.
  group: signals-refresh
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Bumped from 20: the crypto history fetch now pulls up to ~2000 daily
    # bars per coin (was ~210) and stocks fetch 10y (was 1y) for the new
    # dwell/seasonal techniques, so each of the ~160 sequential/pooled
    # requests carries a bigger response — expect build time to grow
    # somewhat from the ~10-11 min baseline. Still well under the hourly
    # cadence either way.
    timeout-minutes: 28
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build signals payload and push to KV
        working-directory: signals-worker
        run: node scripts/build-signals.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FCS_KV_NAMESPACE_ID: ${{ vars.FCS_KV_NAMESPACE_ID }}
          FCS_D1_DATABASE_ID: ${{ vars.FCS_D1_DATABASE_ID }}
          TREFIS_OVERRIDES: ${{ vars.TREFIS_OVERRIDES }}
          # Lets build-signals.mjs's freshness pre-check apply only to
          # scheduled firings, never to a manual workflow_dispatch (which
          # always means "I want a real rebuild right now").
          GITHUB_EVENT_NAME: ${{ github.event_name }}
