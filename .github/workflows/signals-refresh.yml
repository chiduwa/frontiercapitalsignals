name: Signals Refresh

# Runs the Frontier Capital Signals engine (signals-worker/) hourly and
# writes the result into the signals-worker Cloudflare Worker's KV cache.
# Kept separate from deploy.yml (which ships the Next.js app) since this
# job runs on every hour regardless of whether any code changed.
on:
  # GitHub's `schedule` trigger is a request, not a guarantee. Offsetting off
  # the top of the hour wasn't enough (confirmed live over 97 firings:
  # avg gap 142min vs the intended 60min, worst 281min, never once early),
  # and neither was firing 4x/hour instead of 1x: confirmed over the
  # following 5 days (86 firings, 2026-08-04 to 2026-08-09) that cut the
  # average to 81min, but the worst case was still 349min — GitHub's
  # scheduler doesn't just delay individual slots, it drops whole clusters
  # of them during sustained high-load windows (consistently ~00:00-15:00
  # UTC, peak US GitHub usage), so more slots per hour has diminishing
  # returns against a multi-hour outage rather than a single missed pick.
  #
  # Fix: */5 * * * * — GitHub's documented minimum interval (12x/hour).
  # Still doesn't GUARANTEE freshness during a bad window, but maximizes
  # the odds within what GitHub's own scheduler allows, without the added
  # complexity/risk of routing this through an external trigger. Does NOT
  # multiply real build cost — build-signals.mjs's own freshness pre-check
  # (gated to `schedule` events only) skips the ~130-fetch rebuild whenever
  # the last KV write is under ~50min old, so the actual expensive build
  # still only runs roughly once an hour; the extra scheduled slots are
  # cheap insurance, not extra work. This repo is public, so Actions minutes
  # are free/unlimited regardless. If multi-hour gaps persist even at this
  # frequency, the next step is an external trigger (cron-job.org, which
  # this account already uses for KCE/ThriveWorks) calling a secret-gated
  # Cloudflare Worker route rather than GitHub's own scheduler at all —
  # deliberately not done here since it adds a new production endpoint, a
  # new secret, and a new external dependency, and the user chose to try
  # the free/simple option first.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  # This run touches shared state (D1, KV) and now takes ~10-11 minutes;
  # if a delayed firing ever overlaps the next hour's, queue rather than
  # run both at once against the same tables/cache.
  group: signals-refresh
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Bumped from 20: the crypto history fetch now pulls up to ~2000 daily
    # bars per coin (was ~210) and stocks fetch 10y (was 1y) for the new
    # dwell/seasonal techniques, so each of the ~160 sequential/pooled
    # requests carries a bigger response — expect build time to grow
    # somewhat from the ~10-11 min baseline. Still well under the hourly
    # cadence either way.
    timeout-minutes: 28
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build signals payload and push to KV
        working-directory: signals-worker
        run: node scripts/build-signals.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FCS_KV_NAMESPACE_ID: ${{ vars.FCS_KV_NAMESPACE_ID }}
          FCS_D1_DATABASE_ID: ${{ vars.FCS_D1_DATABASE_ID }}
          TREFIS_OVERRIDES: ${{ vars.TREFIS_OVERRIDES }}
          # Lets build-signals.mjs's freshness pre-check apply only to
          # scheduled firings, never to a manual workflow_dispatch (which
          # always means "I want a real rebuild right now").
          GITHUB_EVENT_NAME: ${{ github.event_name }}
