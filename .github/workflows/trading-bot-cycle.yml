name: Trading Bot Cycle

# Runs the autonomous trading bot's decision cycle once per firing —
# trading-bot/src/index.mjs runs one pass and exits (no internal loop),
# since a GitHub Actions runner has no persistent disk between runs; all
# state lives in D1 (trading_bot_* tables, schema.sql) instead of a local
# file. Every position's stop-loss/take-profit lives on the exchange
# itself (Binance's Algo Order API), so protection persists even if a
# run is skipped or fails outright — this cadence doesn't need to be
# perfectly punctual to be safe.
#
# GitHub's own documented cron minimum is 5 minutes, but actual firing
# can lag by several minutes during high platform load — don't assume
# exactly-every-5-minutes precision.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The bot binds to the engine's published contract; the guardrail tests
      # pin that binding (including the engine's own numeric bars). A drift
      # that would leave the bot laxer than the system it follows fails here
      # rather than in a live cycle.
      - name: Verify contract and risk guardrails
        working-directory: trading-bot
        run: node test.mjs

      # The shadow ledger's table and the open-order exit-geometry columns are
      # additive schema this bot owns. Re-running is safe: Wrangler records
      # applied migrations.
      - name: Apply D1 migrations
        working-directory: signals-worker
        run: npx --yes wrangler@4 d1 migrations apply frontier-capital-signals-reliability --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Run one trading bot cycle
        working-directory: trading-bot
        run: node src/index.mjs
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          DRY_RUN: ${{ vars.TRADING_BOT_DRY_RUN || 'true' }}
          # Optional. Set the BINANCE_FAPI_BASE repo variable to
          # https://testnet.binancefuture.com (with testnet API keys) to
          # exercise the real order path against fake money first. The entry
          # and protective-order calls have never executed against any
          # endpoint, so this is the only way to validate them without
          # risking a real position. Unset it to return to mainnet.
          BINANCE_FAPI_BASE: ${{ vars.BINANCE_FAPI_BASE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FCS_D1_DATABASE_ID: ${{ vars.FCS_D1_DATABASE_ID }}
