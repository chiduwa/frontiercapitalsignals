name: Signals Backfill

# On-demand accelerator for the historical archive backfill (see
# signals-daily.yml, which runs the same script once/day automatically).
# Manually re-trigger this a few times in a row to catch the archive up
# faster than the daily cadence alone would, e.g. right after raising
# row_budget once Workers Paid is confirmed active. Idempotent/resumable —
# see backfill-history.mjs's coverage check — so re-running after the
# archive is already caught up is a fast no-op, not a mistake.
on:
  workflow_dispatch:
    inputs:
      backfill_open:
        description: "Re-pull symbols that have no daily open price yet (one-time, after the open column was added)"
        required: false
        default: false
        type: boolean
      row_budget:
        description: "Max price-bar rows to write this run"
        required: false
        default: "15000"
      funding_row_budget:
        description: "Max funding/OI rows to write this run"
        required: false
        default: "4000"
      binance_row_budget:
        description: "Max Binance.US hourly-bar rows to write this run"
        required: false
        default: "15000"
      binance_per_symbol_row_cap:
        description: "Max Binance.US hourly-bar rows any one symbol can consume this run"
        required: false
        default: "3000"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run historical backfill
        working-directory: signals-worker
        run: node scripts/backfill-history.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FCS_D1_DATABASE_ID: ${{ vars.FCS_D1_DATABASE_ID }}
          BACKFILL_ROW_BUDGET: ${{ inputs.row_budget }}
          BACKFILL_FUNDING_ROW_BUDGET: ${{ inputs.funding_row_budget }}
          BINANCE_ROW_BUDGET: ${{ inputs.binance_row_budget }}
          BINANCE_PER_SYMBOL_ROW_CAP: ${{ inputs.binance_per_symbol_row_cap }}
          BACKFILL_OPEN: ${{ inputs.backfill_open && '1' || '' }}
