name: Signals Intraday Tick

# Separate, much cheaper companion to signals-refresh.yml: writes one live
# price sample per curated day-trading watchlist symbol (~35 symbols, two
# bulk calls, no per-coin fetches) every 5 minutes, for minutes-to-hours
# day-trading signals the hourly-cadence engine is too sparse for — see
# signals-worker/scripts/intraday.mjs's top comment for the full "why a
# separate pipeline" reasoning.
#
# Own concurrency group, deliberately not folded into signals-refresh.yml's
# job: that job now takes ~10-11 minutes and queues same-group firings
# behind itself (concurrency: group: signals-refresh), which would throttle
# a tick job that needs to run near-instantly every 5 minutes. This doesn't
# fix GitHub's platform-wide scheduler unreliability under load (confirmed
# live this session: even signals-refresh.yml's 5-minute cron achieves a
# ~20-25min average real gap between job starts, never truly back-to-back)
# — it only removes the self-inflicted queuing cause. The signal logic
# downstream (scripts/intraday.mjs) is built to tolerate irregular tick
# spacing regardless, not assume clean 5-minute sampling.
on:
  schedule:
    # 2026-08-29: a 5-minute request here was delivering ~2 firings a DAY out
    # of 288 (measured 2026-08-28), so the nominal cadence was fiction. Asking
    # for less actually gets more from GitHub's scheduler, and reduces the
    # repo-wide pressure that appears to be causing the drops in the first
    # place. Offset off signals-refresh.yml's :17 so the two don't land on the
    # same wall-clock minute.
    #
    # Note this pipeline still depends on GitHub because it writes D1 tick
    # rows; the price freshness the dashboard displays no longer does (see
    # refreshLivePriceLayer, worker.js, on Cloudflare's own cron).
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: signals-intraday
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    # Two bulk calls plus a handful of D1 writes — should finish in
    # seconds, not minutes. Generous timeout is just insurance against a
    # hung upstream request, not an expectation of actually needing it.
    timeout-minutes: 4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Tick intraday watchlist prices
        working-directory: signals-worker
        run: node scripts/intraday-tick.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FCS_KV_NAMESPACE_ID: ${{ vars.FCS_KV_NAMESPACE_ID }}
          FCS_D1_DATABASE_ID: ${{ vars.FCS_D1_DATABASE_ID }}
