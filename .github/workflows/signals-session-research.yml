name: Signals Session and Stablecoin Research
on:
  schedule:
    - cron: '41 10 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: signals-session-research
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r signals-worker/scripts/tracked-research-requirements.txt
      - name: Verify chronology, DST, and measurement contracts
        working-directory: signals-worker
        run: |
          node --test test-session-data.mjs
          python test-session-research.py
          node --test test-market-insights.mjs
          python test-calendar-stable-research.py
      - uses: actions/cache@v5
        with:
          path: signals-worker/reports/sessions/cache
          key: session-hourly-v1-${{ github.run_id }}
          restore-keys: session-hourly-v1-
      - name: Collect checked hourly archives and completed stablecoin context
        working-directory: signals-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FCS_D1_DATABASE_ID: ${{ vars.FCS_D1_DATABASE_ID }}
        run: |
          node scripts/session-data.mjs
          node scripts/session-context.mjs "$(date -u +%F)" reports/sessions/stable-context.json
      - name: Run per-asset holdout tests
        working-directory: signals-worker
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python scripts/session-research.py --input reports/sessions/panel.json --context reports/sessions/stable-context.json --output reports/sessions/results
          python scripts/calendar-research.py --input reports/sessions/panel.json --output reports/sessions/results
      - name: Store completed timing summaries independently of the volume feed
        working-directory: signals-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FCS_D1_DATABASE_ID: ${{ vars.FCS_D1_DATABASE_ID }}
        run: |
          node scripts/session-context.mjs publish reports/sessions/results/session-report.json
          node scripts/session-context.mjs publish reports/sessions/results/calendar-report.json

      # Record WHAT today's rules are, before their outcomes exist.
      #
      # Separate step, and deliberately after publication: the freeze is the
      # only part of this pipeline whose value is destroyed by being late, but
      # it must never be able to take publication down with it. Append-only and
      # idempotent, so a rerun re-freezes nothing -- the whole point is that an
      # existing rule keeps its original start date no matter how often the
      # study is recomputed. See scripts/session-freeze.mjs.
      - name: Freeze today's timing rules for prospective evaluation
        working-directory: signals-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FCS_D1_DATABASE_ID: ${{ vars.FCS_D1_DATABASE_ID }}
        run: |
          node scripts/session-freeze.mjs \
            reports/sessions/results/session-report.json \
            reports/sessions/results/calendar-report.json
      - name: Collect the named stablecoin basket and CMC100 benchmark
        working-directory: signals-worker
        run: |
          node scripts/stable-basket-data.mjs "$(date -u +%F)" reports/stable-basket/current
          node scripts/cmc-research.mjs "$(date -u +%F)" reports/stable-basket/current
      - name: Test lagged stablecoin explanatory regressions per asset
        working-directory: signals-worker
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python scripts/stable-basket-research.py --input reports/stable-basket/current/panel.json --cmc reports/stable-basket/current/cmc100-series.json --hourly reports/sessions/panel.json --output reports/stable-basket/results
      - name: Store complete non-actionable stablecoin summary
        working-directory: signals-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FCS_D1_DATABASE_ID: ${{ vars.FCS_D1_DATABASE_ID }}
        run: node scripts/session-context.mjs publish reports/stable-basket/results/stable-basket-report.json
      - name: Preserve evidence and data manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: session-stablecoin-research-${{ github.run_id }}
          path: |
            signals-worker/reports/sessions/panel.json
            signals-worker/reports/sessions/stable-context.json
            signals-worker/reports/sessions/results/
            signals-worker/reports/stable-basket/
          retention-days: 90
