name: Signals Tracked Asset Audit

on:
  workflow_run:
    workflows: [Signals Daily]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '21 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signals-tracked-research
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install deterministic research dependency
        run: python -m pip install -r signals-worker/scripts/tracked-research-requirements.txt
      - name: Verify timing, provenance, and nested model selection
        working-directory: signals-worker
        run: |
          node --test test-data-quality.mjs
          python test-tracked-research.py
      - name: Read bounded always-tracked panel
        working-directory: signals-worker
        run: |
          mkdir -p reports/tracked
          node scripts/hierarchical-research.mjs --dry-run --symbols BTC,ETH,SOL,XLM,XRP,HYPE,HBAR,ARB --save-input reports/tracked/panel.json --load-only
          node scripts/tracked-research-data.mjs reports/tracked/panel.json reports/tracked/rows.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FCS_D1_DATABASE_ID: ${{ vars.FCS_D1_DATABASE_ID }}
      - name: Compare per-asset direction, magnitude, and lead-lag candidates
        working-directory: signals-worker
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python scripts/tracked-research.py --input reports/tracked/rows.json --output reports/tracked/results
          node scripts/verify-tracked-prices.mjs reports/tracked/panel.json reports/tracked/results/price-crosscheck.json
          node scripts/tracked-native-comparison.mjs reports/tracked/panel.json reports/tracked/results/native-comparison.json
      - name: Preserve inputs and evidence, including failed runs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tracked-asset-audit-${{ github.run_id }}
          path: signals-worker/reports/tracked/
          retention-days: 90
          if-no-files-found: warn
