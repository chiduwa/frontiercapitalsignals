name: Signals Hierarchical Research

on:
  workflow_run:
    workflows: [Signals Daily]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '47 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signals-hierarchical
  cancel-in-progress: false

jobs:
  research:
    # Runs even after a failed archive job, so a stale-input run is diagnosed
    # rather than skipped. Always checks out trusted main, never the
    # workflow_run event's code.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test the estimator before it is allowed near the archive
        working-directory: signals-worker
        run: |
          node --test test-regression-diagnostics.mjs
          node --test test-hierarchical-model.mjs
      - name: Apply additive schema
        working-directory: signals-worker
        run: npx --yes wrangler@4 d1 migrations apply frontier-capital-signals-reliability --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Fit every asset, pool the class, and score the walk-forward
        working-directory: signals-worker
        run: node scripts/hierarchical-research.mjs --output reports/hierarchical
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FCS_D1_DATABASE_ID: ${{ vars.FCS_D1_DATABASE_ID }}
      - name: Preserve the research report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hierarchical-research-${{ github.run_id }}
          path: signals-worker/reports/hierarchical/
          retention-days: 90
          if-no-files-found: warn
