name: Signals Daily

# Keeps the permanent historical archive (asset_daily_bars, funding_rate_daily
# — see signals-worker/scripts/schema.sql) current: one run/day is plenty for
# daily-grain data. Deliberately its own workflow, not folded into
# signals-refresh.yml (hourly) — this repo already splits unrelated cadences
# for exactly this reason (deploy.yml vs daily-intelligence.yml vs
# signals-refresh.yml): one job's slowness or failure shouldn't block another.
#
# Runs backfill-history.mjs first (safe to call every day, not just once —
# it only ever writes dates not already stored, so once the archive is
# caught up this step degenerates into a cheap incremental append; early on,
# each run chips away at the remaining backfill within its row budget).
on:
  schedule:
    # 02:37 UTC — after D1's daily write-quota reset (00:00 UTC) so this
    # always starts with a full budget, and off the hourly job's :13 mark
    # (see signals-refresh.yml's own note on avoiding top-of-hour/round-
    # minute scheduling contention).
    - cron: "37 2 * * *"
  workflow_dispatch:

concurrency:
  group: signals-daily
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    # Was 30 — confirmed live via the GitHub API this had been silently
    # cancelling this job every day 08-17 through 08-20 (real run history:
    # "Refresh per-asset sentiment" alone took 1508s on the last full
    # success, 08-16, leaving ~1.7min of the 1800s budget; it and everything
    # after it in that step — lead/lag, sector composites, swing-time,
    # score snapshots — has been silently skipped since). 55 gives real
    # headroom as the tracked universe and archive depth keep growing;
    # every individual outbound call already has its own bound via
    # fetchWithTimeout/FETCH_TIMEOUT_MS, so this ceiling is about total
    # aggregate time, not an unbounded-hang risk.
    #
    # 120 as of 2026-09-06: the tracked universe went from ~150 symbols to
    # ~450 and the archive row budgets went up ~8x with it, so the same
    # silent-cancellation failure this comment already documents would
    # otherwise be re-introduced by exactly the change that grew the work.
    # Costs nothing to raise — this repo is public, so Actions minutes are
    # free — and the daily cadence leaves no risk of a long run colliding
    # with the next one under this job's concurrency group.
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Keep the historical archive current
        working-directory: signals-worker
        run: node scripts/backfill-history.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FCS_D1_DATABASE_ID: ${{ vars.FCS_D1_DATABASE_ID }}
          # Sized for this account's confirmed Workers Paid D1 allowance, not
          # the free tier the original values assumed — see the budget
          # constants' own docs in backfill-history.mjs. Repo variables still
          # override, so a single run can be throttled without a code change.
          BACKFILL_ROW_BUDGET: ${{ vars.BACKFILL_ROW_BUDGET || '150000' }}
          BACKFILL_FUNDING_ROW_BUDGET: ${{ vars.BACKFILL_FUNDING_ROW_BUDGET || '20000' }}
          BINANCE_ROW_BUDGET: ${{ vars.BINANCE_ROW_BUDGET || '120000' }}
          BINANCE_PER_SYMBOL_ROW_CAP: ${{ vars.BINANCE_PER_SYMBOL_ROW_CAP || '20000' }}

      # Keeps derivatives_daily current and, with whatever budget is left,
      # keeps deepening it. One script serves both jobs because it only ever
      # fetches dates it does not already hold: on a caught-up archive that is
      # ~141 requests for yesterday, and on a fresh one it walks backwards
      # through history until the budget stops it. Nothing to switch over when
      # the initial deep backfill finishes.
      #
      # The source is Binance's PUBLIC DATA PORTAL, not its trading API —
      # fapi.binance.com is HTTP 451 from Actions and api.bybit.com is HTTP 403
      # CloudFront country-blocked, both re-confirmed 2026-09-11. The portal is
      # the same host family as data-api.binance.vision, already a proven
      # dependency here.
      #
      # continue-on-error: this feeds a research lane that publishes nothing.
      # A portal outage must not fail the job that keeps the live archive and
      # sentiment current.
      - name: Keep the derivatives archive current
        working-directory: signals-worker
        continue-on-error: true
        run: node scripts/backfill-derivatives.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FCS_D1_DATABASE_ID: ${{ vars.FCS_D1_DATABASE_ID }}
          # Small daily slice. The deep backfill is run separately via
          # signals-derivatives-backfill.yml so a multi-hour first pass never
          # sits inside the daily job's critical path.
          DERIV_ROW_BUDGET: ${{ vars.DERIV_ROW_BUDGET || '25000' }}
          DERIV_TIME_BUDGET_MIN: ${{ vars.DERIV_TIME_BUDGET_MIN || '20' }}
          DERIV_START_DATE: ${{ vars.DERIV_START_DATE || '2023-01-01' }}

      # Refits the cross-sectional lane's per-feature coefficients from the
      # archive that was just brought current, then scores whichever logged
      # forecasts have matured and folds them into decile evidence.
      #
      # Reads asset_daily_bars and writes three small tables. No upstream
      # supplier is called, so this step adds no API cost, no rate-limit
      # pressure, and no new secret — it is arithmetic over data the hourly
      # build has already paid for.
      #
      # Runs daily rather than hourly on purpose: the estimation window is 156
      # weekly cross-sections, so a refit between two hourly builds cannot
      # move a coefficient enough to matter, and hourly refitting would just
      # spend D1 writes to watch the same number.
      #
      # continue-on-error: this is a shadow research lane. It publishes
      # nothing, and a failure here must not fail a job whose main purpose is
      # keeping the archive and sentiment current.
      - name: Refit cross-sectional lane
        working-directory: signals-worker
        continue-on-error: true
        run: node scripts/cross-sectional.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FCS_D1_DATABASE_ID: ${{ vars.FCS_D1_DATABASE_ID }}

      - name: Refresh per-asset sentiment
        working-directory: signals-worker
        run: node scripts/daily-refresh.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FCS_D1_DATABASE_ID: ${{ vars.FCS_D1_DATABASE_ID }}
          # Both optional — CoinMarketCap's Fear & Greed cross-check and
          # CryptoPanic's per-asset news sentiment simply don't run until
          # these are set (coinmarketcap.com/api, cryptopanic.com/developers/api,
          # both free). CoinGecko's community-vote sentiment needs no key.
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          CRYPTOPANIC_API_TOKEN: ${{ secrets.CRYPTOPANIC_API_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
