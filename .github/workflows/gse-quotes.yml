name: GSE Quotes

# The Ghana Stock Exchange price API (dev.kwayisi.org) refuses connections from
# Cloudflare's egress ranges — every request from a Worker times out, at any
# timeout, from every colo. A GitHub runner can reach it, so quotes are pulled
# here and written to the FCS_QUOTES KV namespace for /api/quotes to read.
#
# The GSE trades 10:00-15:00 GMT, so this runs shortly after the close and again
# mid-morning to pick up any late correction.

on:
  schedule:
    - cron: "30 15 * * 1-5" # 15:30 UTC, just after the Accra close
    - cron: "30 6 * * 1-5" # 06:30 UTC, ahead of the European morning
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch GSE live prices
        run: |
          set -euo pipefail
          curl -sS --fail --retry 3 --retry-delay 5 --max-time 60 \
            -H 'Accept: application/json' \
            -A 'Mozilla/5.0 (compatible; FrontierCapitalSignals/1.0)' \
            'https://dev.kwayisi.org/apis/gse/live' -o gse_live.json

          # Fail loudly rather than publishing an empty board.
          node -e "
            const rows = JSON.parse(require('fs').readFileSync('gse_live.json','utf8'));
            if (!Array.isArray(rows) || rows.length === 0) throw new Error('GSE feed returned no rows');
            const priced = rows.filter(r => typeof r.price === 'number' && r.price > 0);
            if (priced.length < 20) throw new Error('GSE feed returned only ' + priced.length + ' priced rows');
            const payload = { fetchedAt: new Date().toISOString(), rows: priced };
            require('fs').writeFileSync('gse_payload.json', JSON.stringify(payload));
            console.log('GSE rows:', priced.length);
          "

      - name: Write to Cloudflare KV
        run: |
          npx wrangler@4 kv key put gse:live \
            --path gse_payload.json \
            --namespace-id "$KV_NAMESPACE_ID" \
            --remote
        env:
          KV_NAMESPACE_ID: 7c1d54e367ce4e53abd96370cb0203be
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
