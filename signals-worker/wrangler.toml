name = "frontier-capital-signals"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[observability]
enabled = true

# Bind the KV namespace that stores the hourly payload.
# Create it once:  npx wrangler kv namespace create FCS_CACHE
# then paste the returned id below.
[[kv_namespaces]]
binding = "FCS_CACHE"
id = "9dd922a242fc4fa58853b954693b9eee"

# Same D1 database the hourly build (scripts/build-signals.mjs, via the REST
# API) already writes. The Worker reads it only for the narrow asset drill-down,
# RSS feed, and authenticated account-journal routes; the heavy engine remains
# outside the request path. The account-journal alert watermark is stored in KV.
[[d1_databases]]
binding = "FCS_DB"
database_name = "frontier-capital-signals-reliability"
database_id = "b07a4faa-8330-4b13-bf94-99fc662d4d6e"

# The cron does not run the engine: scheduled() reads one KV value and, only
# when stale, dispatches the existing GitHub Actions build. It needs the
# GITHUB_ACTIONS_TOKEN Worker secret documented in README.md.
[triggers]
crons = ["*/5 * * * *"]

# The actual engine remains in GitHub Actions because ~130 fetches plus
# indicator math across ~260 assets exceeds Workers Free plan limits.

# Serve only on the /signals path of the existing zone; the rest of the site
# on Cloudflare (the Next.js app) is untouched.
[[routes]]
pattern = "frontiercapitalsignals.com/signals*"
zone_name = "frontiercapitalsignals.com"

# Optional: model-based valuation overrides (Trefis or your own targets)
# [vars]
# TREFIS_OVERRIDES = "{\"AAPL\":275.0,\"NFLX\":88.0}"
